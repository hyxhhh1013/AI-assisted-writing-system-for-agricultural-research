services:
  app:
    build: .
    container_name: grainscript
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      PYTHON_CMD: python3
    volumes:
      - ./data:/app/data
      - ./prisma:/app/prisma
      - ./public/charts:/app/public/charts
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:3000').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
