name: Deploy to VPS

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-vps
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT != '' && secrets.DEPLOY_PORT || 22 }}
          command_timeout: 45m
          envs: DEPLOY_DIR
          script: |
            set -euo pipefail
            cd "${DEPLOY_DIR:-/opt/grainscript}"
            if [[ -d .git ]]; then
              git fetch origin main
              git checkout main
              git reset --hard origin/main
            fi
            bash scripts/deploy/vps-up.sh
        env:
          DEPLOY_DIR: ${{ secrets.DEPLOY_PATH != '' && secrets.DEPLOY_PATH || '/opt/grainscript' }}
