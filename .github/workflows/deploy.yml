name: Deploy to VPS (PM2)

# 日常部署请用 scripts/deploy/package.ps1 + apply.sh（standalone 上传）。
# 本 workflow 仅手动触发，避免 push 时在错误目录跑旧 Docker 脚本或误覆盖线上。
on:
  workflow_dispatch:

concurrency:
  group: deploy-vps
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT != '' && secrets.DEPLOY_PORT || 22 }}
          command_timeout: 45m
          envs: DEPLOY_DIR,DEPLOY_BRANCH
          script: |
            set -euo pipefail
            cd "${DEPLOY_DIR:-/home/ubuntu/grainscript}"
            export DEPLOY_BRANCH="${DEPLOY_BRANCH:-main}"
            bash scripts/deploy/pm2-up.sh
        env:
          DEPLOY_DIR: ${{ secrets.DEPLOY_PATH != '' && secrets.DEPLOY_PATH || '/home/ubuntu/grainscript' }}
          DEPLOY_BRANCH: ${{ github.ref_name }}
