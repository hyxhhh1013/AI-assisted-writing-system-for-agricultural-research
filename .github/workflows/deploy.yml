name: Deploy to VPS (PM2)

on:
  push:
    branches: [cursor/code-quality-cleanup, main]
  workflow_dispatch:

concurrency:
  group: deploy-vps
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT != '' && secrets.DEPLOY_PORT || 22 }}
          command_timeout: 45m
          envs: DEPLOY_DIR,DEPLOY_BRANCH
          script: |
            set -euo pipefail
            cd "${DEPLOY_DIR:-/opt/grainscript}"
            export DEPLOY_BRANCH="${DEPLOY_BRANCH:-cursor/code-quality-cleanup}"
            bash scripts/deploy/pm2-up.sh
        env:
          DEPLOY_DIR: ${{ secrets.DEPLOY_PATH != '' && secrets.DEPLOY_PATH || '/opt/grainscript' }}
          DEPLOY_BRANCH: ${{ github.ref_name }}
