name: Deploy to VPS (PM2)

# push main → CI 云端 build → 上传 deploy.tar.gz → apply.sh → pm2 reload
# 本地日常可继续: powershell -File scripts/deploy/package.ps1
# 手动重发: Actions → Deploy to VPS (PM2) → Run workflow

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-vps
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Typecheck
        run: npm run typecheck

      - name: Build deploy bundle
        run: bash scripts/deploy/package.sh

      - name: Upload bundle to VPS
        uses: appleboy/scp-action@v1.0.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT != '' && secrets.DEPLOY_PORT || 22 }}
          source: deploy.tar.gz
          target: /home/ubuntu/

      - name: Apply on server
        uses: appleboy/ssh-action@v1.2.1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT != '' && secrets.DEPLOY_PORT || 22 }}
          command_timeout: 30m
          script: |
            set -euo pipefail
            APP_DIR="${{ secrets.DEPLOY_PATH != '' && secrets.DEPLOY_PATH || '/home/ubuntu/grainscript' }}"
            export APP_DIR
            export TAR_FILE="/home/ubuntu/deploy.tar.gz"
            bash "$APP_DIR/scripts/deploy/apply.sh"
